<div class="container" id="app"></div>
<script>
'use strict';

// ─── Constants ───
// [columns, rows]. Rows run between the players, so the long side is rows.
// Square even boards are the modern form; the rectangular ones are recorded
// traditional papamū (9×11 at Puʻuhonua o Hōnaunau; 9×13, 14×17, 13×20).
const BOARDS = [[6,6],[8,8],[10,10],[6,7],[9,11],[9,13],[14,17],[13,20]];
const MIN_DIM = 4, MAX_DIM = 20;
const POLL_INTERVAL_MS = 3000;
const CELL = 40;              // SVG units per square
const STONE_R = 15;
const COLOR_HEX = { black: '#1a1814', white: '#f5ecd4' };
const COLOR_STROKE = { black: '#000000', white: '#a89878' };
const PAPER = { ink: '#3c3530', inkSoft: '#8b7d6b', line: '#a89878', rust: '#a65f3d', shade: '#e9dfc4' };
const PLAYERS = ['black', 'white'];
const ORTHO = [[1,0],[-1,0],[0,1],[0,-1]];
const OTHER = { black: 'white', white: 'black' };

// ─── Geometry ───
// Board is a flat array of rows*cols; index = row*cols + col. Row 0 is the top edge.
// D = { R: rows, C: cols }. Older rooms stored a single square `size`.
// Square (row, col) holds black when (row + col) is even — so both corners on
// the main diagonal and the two centre squares on that diagonal are black.
const dims = s => ({ R: s.rows || s.size, C: s.cols || s.size });
const idx = (D, r, c) => r * D.C + c;
const inBounds = (D, r, c) => r >= 0 && c >= 0 && r < D.R && c < D.C;
const colLetter = c => String.fromCharCode(97 + c);
const sqName = (D, r, c) => colLetter(c) + (D.R - r);   // a1 = bottom-left

function initialBoard(D) {
  const b = new Array(D.R * D.C);
  for (let r = 0; r < D.R; r++) for (let c = 0; c < D.C; c++) b[idx(D, r, c)] = (r + c) % 2 === 0 ? 'black' : 'white';
  return b;
}

function newGameId() { return Math.random().toString(36).slice(2, 10); }

function initialState(cols, rows, sameDevice) {
  return {
    game: 'konane',
    gameId: newGameId(),
    rows, cols,
    players: PLAYERS.slice(),
    board: initialBoard({ R: rows, C: cols }),
    phase: 'open-black',      // 'open-black' → 'open-white' → 'play'
    turn: 'black',
    claimedBy: { black: null, white: null },
    sameDevice: !!sameDevice,
    capturedBy: { black: 0, white: 0 },
    winner: null,
    lastMove: null,           // { from:[r,c], to:[r,c], captured:[[r,c],...] } or { removed:[r,c] }
    history: [],
    moveCount: 0,
    notes: [],
    startedAt: new Date().toISOString(),
  };
}

// ─── Rules ───
// Opening: black removes one black stone from a corner or the centre;
// white then removes one white stone orthogonally adjacent to that hole.
function openingRemovals(s) {
  const n = dims(s), out = [];
  if (s.phase === 'open-black') {
    // Centre = middle two lines of an even side, middle one line of an odd side.
    const mid = k => k % 2 ? [(k - 1) / 2] : [k / 2 - 1, k / 2];
    const cand = [[0,0],[n.R-1,n.C-1],[0,n.C-1],[n.R-1,0]];
    for (const r of mid(n.R)) for (const c of mid(n.C)) cand.push([r, c]);
    for (const [r, c] of cand) if (s.board[idx(n, r, c)] === 'black') out.push([r, c]);
  } else if (s.phase === 'open-white') {
    const [hr, hc] = s.lastMove.removed;
    for (const [dr, dc] of ORTHO) {
      const r = hr + dr, c = hc + dc;
      if (inBounds(n, r, c) && s.board[idx(n, r, c)] === 'white') out.push([r, c]);
    }
  }
  return out;
}

// All landing squares for the stone at (r,c). A move is one or more jumps in a
// single straight line; each jump passes over an adjacent opponent stone into
// the empty square beyond. The mover may stop after any jump.
function jumpsFrom(board, n, r, c) {   // n = dims
  const color = board[idx(n, r, c)];
  if (!color) return [];
  const opp = OTHER[color];
  const out = [];
  for (const [dr, dc] of ORTHO) {
    const captured = [];
    let k = 1;
    while (true) {
      const mr = r + dr * (2*k - 1), mc = c + dc * (2*k - 1);
      const lr = r + dr * 2*k,       lc = c + dc * 2*k;
      if (!inBounds(n, lr, lc)) break;
      if (board[idx(n, mr, mc)] !== opp || board[idx(n, lr, lc)]) break;
      captured.push([mr, mc]);
      out.push({ to: [lr, lc], captured: captured.slice() });
      k++;
    }
  }
  return out;
}

function allMoves(board, n, color) {
  const moves = [];
  for (let r = 0; r < n.R; r++) for (let c = 0; c < n.C; c++) {
    if (board[idx(n, r, c)] !== color) continue;
    for (const j of jumpsFrom(board, n, r, c)) moves.push({ from: [r, c], to: j.to, captured: j.captured });
  }
  return moves;
}

// ─── App state ───
let state = null;
let roomCode = null;
let selected = null;          // [r,c] of the stone this client has picked up
let noteAuthor = 'observer';
let pollTimer = null;
let putInFlight = false;
let lastError = null;
let syncStatus = 'idle';
let connecting = false;
let pendingNoteText = '';
let lobbyCols = 8, lobbyRows = 8;
let hintMsg = '';

// ─── Client identity (shared key with vesica, so one browser = one id) ───
const CLIENT_ID_KEY = 'vesica:clientId';
function getClientId() {
  let id = null;
  try { id = localStorage.getItem(CLIENT_ID_KEY); } catch {}
  if (!id) {
    id = 'c_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    try { localStorage.setItem(CLIENT_ID_KEY, id); } catch {}
  }
  return id;
}
const MY_CLIENT_ID = getClientId();

function myColors() {
  if (!state || !state.claimedBy) return [];
  return PLAYERS.filter(p => state.claimedBy[p] === MY_CLIENT_ID);
}
function isMyTurn() {
  return !!state && !state.winner && state.claimedBy[state.turn] === MY_CLIENT_ID;
}

// ─── URL helpers ───
function getRoomFromUrl() {
  const p = new URLSearchParams(location.search);
  const r = (p.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  return r || null;
}
function setRoomInUrl(code) {
  const url = new URL(location.href);
  url.searchParams.set('room', code);
  history.replaceState(null, '', url.toString());
}

// ─── API (reuses the vesica room store; state.game tags the type) ───
async function apiCreateGame(initial) {
  const res = await fetch('/api/vesica/games', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ state: initial }),
  });
  if (!res.ok) throw new Error('Could not create room (' + res.status + ')');
  return await res.json();
}
async function apiGetGame(code) {
  const res = await fetch('/api/vesica/games/' + encodeURIComponent(code));
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('Could not fetch room (' + res.status + ')');
  return await res.json();
}
async function apiPutGame(code, st) {
  const res = await fetch('/api/vesica/games/' + encodeURIComponent(code), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ state: st }),
  });
  if (!res.ok) throw new Error('Could not save move (' + res.status + ')');
  return await res.json();
}

// ─── Sync ───
function setSync(status, errMsg) {
  syncStatus = status;
  lastError = status === 'error' ? (errMsg || 'sync error') : null;
  render();
}
async function pushState() {
  if (!roomCode || !state) return;
  putInFlight = true;
  try { await apiPutGame(roomCode, state); putInFlight = false; setSync('live'); }
  catch (e) { putInFlight = false; setSync('error', e.message); }
}
async function pullState() {
  if (!roomCode || putInFlight) return;
  try {
    const resp = await apiGetGame(roomCode);
    if (!resp) { setSync('error', 'room ' + roomCode + ' not found'); stopPolling(); return; }
    const remote = resp.state;
    // Accept the remote when: a new game was started (gameId changed), it is
    // further along, it has more notes, or seat claims shifted.
    const newGame = !state || remote.gameId !== state.gameId;
    const ahead = (remote.moveCount || 0) > (state ? state.moveCount : 0);
    const moreNotes = (remote.notes || []).length > (state ? (state.notes || []).length : 0);
    const claims = state && JSON.stringify(remote.claimedBy) !== JSON.stringify(state.claimedBy);
    if (newGame || ahead || moreNotes || claims) {
      if (newGame || ahead) selected = null;
      state = remote; setSync('live'); return;
    }
    if (syncStatus !== 'live') setSync('live');
  } catch (e) { setSync('error', e.message); }
}
function startPolling() { if (!pollTimer) pollTimer = setInterval(pullState, POLL_INTERVAL_MS); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// ─── Actions ───
async function createRoom(sameDevice) {
  if (connecting) return;
  connecting = true; render();
  try {
    const initial = initialState(lobbyCols, lobbyRows, sameDevice);
    initial.claimedBy.black = MY_CLIENT_ID;
    if (sameDevice) initial.claimedBy.white = MY_CLIENT_ID;
    const resp = await apiCreateGame(initial);
    roomCode = resp.code; state = initial; selected = null;
    setRoomInUrl(roomCode);
    connecting = false; setSync('live'); startPolling();
  } catch (e) { connecting = false; setSync('error', e.message); }
}

async function joinRoom(code) {
  code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!code) return;
  connecting = true; render();
  try {
    const resp = await apiGetGame(code);
    if (!resp) { connecting = false; setSync('error', 'room ' + code + ' not found'); return; }
    if (!resp.state || resp.state.game !== 'konane') {
      // Rooms are shared with vesica; send the visitor to the right board.
      location.href = '/vesica?room=' + code; return;
    }
    let s = resp.state;
    let claimedHere = false;
    if (!PLAYERS.some(p => s.claimedBy[p] === MY_CLIENT_ID)) {
      for (const p of PLAYERS) {
        if (!s.claimedBy[p]) {
          s = Object.assign({}, s, { claimedBy: Object.assign({}, s.claimedBy, { [p]: MY_CLIENT_ID }) });
          claimedHere = true; break;
        }
      }
    }
    roomCode = code; state = s; selected = null;
    setRoomInUrl(code);
    connecting = false; setSync('live');
    if (claimedHere) await pushState();
    startPolling();
  } catch (e) { connecting = false; setSync('error', e.message); }
}

function commit(next) {
  state = next; selected = null; hintMsg = ''; render(); pushState();
}

function removeOpening(r, c) {
  const n = dims(state);
  const board = state.board.slice();
  board[idx(n, r, c)] = null;
  const who = state.turn;
  const entry = who[0].toUpperCase() + ' −' + sqName(n, r, c);
  const nextPhase = state.phase === 'open-black' ? 'open-white' : 'play';
  commit(Object.assign({}, state, {
    board, phase: nextPhase, turn: OTHER[who],
    lastMove: { removed: [r, c] },
    history: state.history.concat([entry]),
    moveCount: state.moveCount + 1,
  }));
}

function playMove(from, to, captured) {
  const n = dims(state);
  const board = state.board.slice();
  const color = board[idx(n, from[0], from[1])];
  board[idx(n, to[0], to[1])] = color;
  board[idx(n, from[0], from[1])] = null;
  for (const [r, c] of captured) board[idx(n, r, c)] = null;
  const next = OTHER[color];
  // Normal-play convention: whoever cannot move on their turn loses.
  const winner = allMoves(board, n, next).length === 0 ? color : null;
  const cap = Object.assign({}, state.capturedBy, { [color]: state.capturedBy[color] + captured.length });
  const entry = sqName(n, from[0], from[1]) + '×' + sqName(n, to[0], to[1]);
  commit(Object.assign({}, state, {
    board, turn: next, winner, capturedBy: cap,
    lastMove: { from, to, captured },
    history: state.history.concat([entry]),
    moveCount: state.moveCount + 1,
  }));
}

function tapSquare(r, c) {
  if (!state || state.winner) return;
  if (!isMyTurn()) { hintMsg = 'waiting on ' + state.turn; render(); return; }
  const n = dims(state);
  if (state.phase !== 'play') {
    if (openingRemovals(state).some(([a, b]) => a === r && b === c)) removeOpening(r, c);
    else { hintMsg = state.phase === 'open-black'
      ? 'black lifts one of its stones from a corner or the centre'
      : 'white lifts one of its stones beside the hole'; render(); }
    return;
  }
  if (selected) {
    const jumps = jumpsFrom(state.board, n, selected[0], selected[1]);
    const hit = jumps.find(j => j.to[0] === r && j.to[1] === c);
    if (hit) { playMove(selected, hit.to, hit.captured); return; }
  }
  if (state.board[idx(n, r, c)] === state.turn) {
    const jumps = jumpsFrom(state.board, n, r, c);
    if (jumps.length) { selected = (selected && selected[0] === r && selected[1] === c) ? null : [r, c]; hintMsg = ''; }
    else { selected = null; hintMsg = 'that stone has no jump'; }
  } else { selected = null; hintMsg = ''; }
  render();
}

function newGame() {
  if (!state) return;
  if (state.moveCount > 0 && !confirm('Start a new game in this room? The current board will be lost for everyone.')) return;
  const D = dims(state);
  const fresh = initialState(D.C, D.R, state.sameDevice);
  fresh.claimedBy = Object.assign({}, state.claimedBy);
  fresh.notes = state.notes || [];   // field notes carry across games in a room
  commit(fresh);
}

function leaveRoom() {
  stopPolling(); roomCode = null; state = null; selected = null;
  const url = new URL(location.href); url.searchParams.delete('room');
  history.replaceState(null, '', url.toString());
  setSync('idle');
}

function addNote(text) {
  if (!state || !text.trim()) return;
  const note = { text: text.trim(), author: noteAuthor, moveCount: state.moveCount, timestamp: new Date().toISOString() };
  state = Object.assign({}, state, { notes: (state.notes || []).concat([note]) });
  render(); pushState();
}

function copyRoomLink() {
  const url = location.href;
  const flash = m => { const el = document.getElementById('copy-msg'); if (el) { el.textContent = m; setTimeout(() => { el.textContent = ''; }, 2400); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => flash('link copied'), () => flash(url));
  else flash(url);
}

// ─── Render ───
const app = document.getElementById('app');
const escapeHtml = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function buildBoardSvg() {
  const n = dims(state), pad = 26, W = n.C * CELL + pad * 2, H = n.R * CELL + pad * 2;
  const mine = isMyTurn();
  const removable = (mine && state.phase !== 'play') ? openingRemovals(state) : [];
  const movable = new Set();
  if (mine && state.phase === 'play') for (const m of allMoves(state.board, n, state.turn)) movable.add(m.from.join(','));
  const targets = selected ? jumpsFrom(state.board, n, selected[0], selected[1]) : [];
  const lm = state.lastMove || {};
  const capturedSet = new Set((lm.captured || []).map(p => p.join(',')));

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<rect x="${pad-8}" y="${pad-8}" width="${n.C*CELL+16}" height="${n.R*CELL+16}" rx="6" fill="${PAPER.shade}" stroke="${PAPER.line}" stroke-width="0.8"/>`;
  for (let i = 0; i < n.C; i++)
    svg += `<text x="${pad + i * CELL + CELL / 2}" y="${H - 6}" font-size="10" text-anchor="middle" fill="${PAPER.inkSoft}" font-style="italic">${colLetter(i)}</text>`;
  for (let i = 0; i < n.R; i++)
    svg += `<text x="8" y="${pad + i * CELL + CELL/2 + 3}" font-size="10" text-anchor="middle" fill="${PAPER.inkSoft}" font-style="italic">${n.R - i}</text>`;
  for (let r = 0; r < n.R; r++) for (let c = 0; c < n.C; c++) {
    const x = pad + c * CELL + CELL / 2, y = pad + r * CELL + CELL / 2;
    const stone = state.board[idx(n, r, c)];
    const key = r + ',' + c;
    // lua (carved hollow) at every point
    svg += `<circle cx="${x}" cy="${y}" r="${STONE_R + 1}" fill="${PAPER.ink}" opacity="0.07"/>`;
    if (capturedSet.has(key) || (lm.removed && lm.removed[0] === r && lm.removed[1] === c)) {
      svg += `<circle cx="${x}" cy="${y}" r="${STONE_R - 4}" fill="none" stroke="${PAPER.rust}" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.7"/>`;
    }
    if (stone) {
      svg += `<circle cx="${x + 0.9}" cy="${y + 1.4}" r="${STONE_R}" fill="${PAPER.ink}" opacity="0.18"/>`;
      svg += `<circle cx="${x}" cy="${y}" r="${STONE_R}" fill="${COLOR_HEX[stone]}" stroke="${COLOR_STROKE[stone]}" stroke-width="0.6"/>`;
      const isSel = selected && selected[0] === r && selected[1] === c;
      const isLast = lm.to && lm.to[0] === r && lm.to[1] === c;
      if (isSel) svg += `<circle cx="${x}" cy="${y}" r="${STONE_R + 3.5}" fill="none" stroke="${PAPER.rust}" stroke-width="2"/>`;
      else if (removable.some(([a, b]) => a === r && b === c) || (!selected && movable.has(key)))
        svg += `<circle cx="${x}" cy="${y}" r="${STONE_R + 3}" fill="none" stroke="${PAPER.rust}" stroke-width="0.9" opacity="0.55"/>`;
      else if (isLast) svg += `<circle cx="${x}" cy="${y}" r="${STONE_R + 3}" fill="none" stroke="${PAPER.inkSoft}" stroke-width="0.9" opacity="0.8"/>`;
    }
    if (targets.some(t => t.to[0] === r && t.to[1] === c)) svg += `<circle cx="${x}" cy="${y}" r="5" fill="${PAPER.rust}" opacity="0.85"/>`;
    svg += `<rect class="sq-tap" data-r="${r}" data-c="${c}" x="${x - CELL/2}" y="${y - CELL/2}" width="${CELL}" height="${CELL}" fill="transparent" style="cursor:${mine ? 'pointer' : 'default'}"/>`;
  }
  return svg + '</svg>';
}

function buildLobby() {
  const busy = connecting ? 'disabled' : '';
  const err = lastError ? `<div class="error-banner">${escapeHtml(lastError)}</div>` : '';
  const sizeBtns = BOARDS.map(([c, r]) => `<button class="author-btn${c === lobbyCols && r === lobbyRows ? ' active' : ''}" data-board="${c},${r}">${c}×${r}</button>`).join('');
  const custom = `<label>custom <input class="dim-input" id="dim-c" type="number" min="${MIN_DIM}" max="${MAX_DIM}" value="${lobbyCols}"> × <input class="dim-input" id="dim-r" type="number" min="${MIN_DIM}" max="${MAX_DIM}" value="${lobbyRows}"></label>`;
  return `
    <header><h1>kōnane</h1><p class="subtitle">hawaiian jumping game · play together, anywhere</p></header>
    ${err}
    <div class="picker">
      <p>board</p>
      <div class="size-row">${sizeBtns}</div>
      <div class="size-row">${custom}</div>
      <p class="sync-text">columns × rows · rows run between the players</p>
      <div class="picker-buttons">
        <button class="choice" id="pick-remote" ${busy}>new room · two devices</button>
        <button class="choice" id="pick-local" ${busy}>new room · one device</button>
      </div>
      <p>join with a room code</p>
      <div class="join-row">
        <input class="code-input" id="join-code" placeholder="ABCDEF" maxlength="6" autocomplete="off">
        <button class="choice" id="join-btn" ${busy}>join</button>
      </div>
    </div>
    ${rulesHtml()}
    <footer>anonymous rooms · share the link to play · the player who cannot jump loses</footer>`;
}

function rulesHtml() {
  return `<details class="rules"><summary>how to play</summary><ol>
    <li>The board starts full: black and white stones alternate on every point.</li>
    <li>Black opens by lifting one black stone from a corner or the centre. White then lifts one white stone orthogonally beside that hole.</li>
    <li>From then on, each turn is one move: jump one of your stones over an adjacent opponent stone into the empty point directly beyond, capturing it. Up, down, left or right — never diagonal.</li>
    <li>You may keep jumping in the same straight line, capturing each stone passed. You may stop after any jump. You may not turn.</li>
    <li>You must move if you can. The first player with no jump on their turn loses.</li>
  </ol></details>`;
}

function buildGame() {
  const mine = myColors();
  const n = dims(state);
  let status;
  if (state.winner) status = `<div class="winner">${escapeHtml(state.winner)} wins · ${escapeHtml(OTHER[state.winner])} has no jump</div>`;
  else {
    const what = state.phase === 'open-black' ? ' · lift a stone' : state.phase === 'open-white' ? ' · lift beside the hole' : '';
    status = `<div class="turn-label ${state.turn}-turn">${escapeHtml(state.turn)}'s turn${what}</div>`;
  }
  let roleLine;
  if (state.sameDevice && mine.length === 2) roleLine = 'one device · both colours here';
  else if (mine.length) {
    roleLine = `you are <strong>${escapeHtml(mine[0])}</strong> · ${isMyTurn() ? 'your move' : 'waiting on ' + escapeHtml(state.turn)}`;
    const open = PLAYERS.filter(p => !state.claimedBy[p]);
    if (open.length) roleLine += ` · still open: ${escapeHtml(open.join(', '))}`;
  } else roleLine = 'observing · both seats claimed';

  const live = !state.winner && state.phase === 'play' ? ` · jumps available: black ${allMoves(state.board, n, 'black').length}, white ${allMoves(state.board, n, 'white').length}` : '';
  const hist = state.history.length
    ? state.history.map((h, i) => `<span class="${i === state.history.length - 1 ? 'last' : ''}">${i + 1}. ${escapeHtml(h)}</span>`).join(' ')
    : '';

  const notes = state.notes || [];
  const notesList = notes.length === 0
    ? '<p class="empty-notes">no observations yet — record what shifts during play</p>'
    : notes.map(nt => {
        const cls = nt.author === 'white' ? 'white-author' : nt.author === 'black' ? '' : 'observer-author';
        return `<div class="note ${cls}"><div class="note-meta">${escapeHtml(nt.author)} · move ${nt.moveCount} · ${escapeHtml(new Date(nt.timestamp).toLocaleString(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}))}</div><div>${escapeHtml(nt.text)}</div></div>`;
      }).join('');
  const aBtn = (v, l) => `<button class="author-btn${noteAuthor === v ? ' active' + (v === 'white' ? ' white-active' : '') : ''}" data-author="${v}">${l}</button>`;

  const syncClass = syncStatus === 'live' ? 'live' : syncStatus === 'error' ? 'error' : '';
  const syncText = syncStatus === 'live' ? 'synced' : syncStatus === 'error' ? (lastError || 'sync error') : 'connecting…';
  const errBanner = (syncStatus === 'error' && lastError) ? `<div class="error-banner">${escapeHtml(lastError)}</div>` : '';

  return `
    <header><h1>kōnane</h1><p class="subtitle">${n.C}×${n.R} · black opens</p></header>
    <div class="room-bar">
      <div class="room-code"><span class="label">room</span><span class="code">${escapeHtml(roomCode)}</span></div>
      <button class="text" id="copy-link-btn">copy link</button>
      <span class="sync-text" id="copy-msg"></span>
    </div>
    ${errBanner}
    <div class="status">
      ${status}
      <div class="captures">${roleLine}</div>
      <div class="captures">captured · black ${state.capturedBy.black} · white ${state.capturedBy.white} · move ${state.moveCount}${live}</div>
      <div class="captures"><span class="sync-dot ${syncClass}"></span><span class="sync-text">${escapeHtml(syncText)}</span></div>
    </div>
    <div class="hint">${escapeHtml(hintMsg)}</div>
    <div class="board-container">${buildBoardSvg()}</div>
    <div class="history">${hist}</div>
    <div class="controls" style="margin-top:1rem;">
      <button class="text" id="new-game-btn">new game</button>
      <button class="text" id="leave-btn">leave room</button>
    </div>
    <section class="notes-section">
      <h2>field notes</h2>
      ${notesList}
      <div class="add-note-row">
        <div class="author-toggle"><span>recording as:</span>${aBtn('black','Black')}${aBtn('white','White')}${aBtn('observer','Observer')}</div>
        <textarea id="note-input" class="note-input" rows="3" placeholder="what shifted? what was tempting? what did you notice?"></textarea>
        <div class="controls" style="margin-bottom:0;"><button class="text" id="add-note-btn">record</button></div>
      </div>
    </section>
    ${rulesHtml()}
    <footer>black → white · orthogonal jumps, straight lines only · state synced every ${POLL_INTERVAL_MS/1000}s</footer>`;
}

function render() {
  const ni = document.getElementById('note-input'); if (ni) pendingNoteText = ni.value;
  const ji = document.getElementById('join-code'); const joinVal = ji ? ji.value : '';
  const rulesOpen = !!document.querySelector('details.rules[open]');
  app.innerHTML = (state && roomCode) ? buildGame() : buildLobby();
  const ni2 = document.getElementById('note-input'); if (ni2 && pendingNoteText) ni2.value = pendingNoteText;
  const ji2 = document.getElementById('join-code'); if (ji2 && joinVal) ji2.value = joinVal;
  if (rulesOpen) { const d = document.querySelector('details.rules'); if (d) d.open = true; }
  attachHandlers();
}

function attachHandlers() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
  on('pick-remote', () => createRoom(false));
  on('pick-local', () => createRoom(true));
  on('join-btn', () => { const i = document.getElementById('join-code'); if (i) joinRoom(i.value); });
  const ji = document.getElementById('join-code');
  if (ji) ji.addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(ji.value); });
  on('new-game-btn', newGame);
  on('leave-btn', leaveRoom);
  on('copy-link-btn', copyRoomLink);
  on('add-note-btn', () => { const i = document.getElementById('note-input'); if (i) { const v = i.value; i.value = ''; pendingNoteText = ''; addNote(v); } });
  document.querySelectorAll('[data-board]').forEach(el => el.addEventListener('click', () => { [lobbyCols, lobbyRows] = el.dataset.board.split(',').map(Number); render(); }));
  const clampDim = v => Math.max(MIN_DIM, Math.min(MAX_DIM, parseInt(v, 10) || MIN_DIM));
  const dc = document.getElementById('dim-c'), dr = document.getElementById('dim-r');
  if (dc) dc.addEventListener('change', () => { lobbyCols = clampDim(dc.value); render(); });
  if (dr) dr.addEventListener('change', () => { lobbyRows = clampDim(dr.value); render(); });
  document.querySelectorAll('[data-author]').forEach(el => el.addEventListener('click', () => { noteAuthor = el.dataset.author; render(); }));
  document.querySelectorAll('.sq-tap').forEach(el => el.addEventListener('click', () => tapSquare(parseInt(el.dataset.r, 10), parseInt(el.dataset.c, 10))));
}

// ─── Init ───
(function init() { const r = getRoomFromUrl(); if (r) joinRoom(r); else render(); })();
</script>
</body>
</html>
